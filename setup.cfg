[metadata]
name = openmovement
version = 0.0.6
author = Daniel Jackson and Jan Christian Brond
description = Open Movement processing code
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/digitalinteraction/openmovement-python/
project_urls =
    Bug Tracker = https://github.com/digitalinteraction/openmovement-python/issues
[options]
package_dir =
    = src
packages = find:
python_requires = >=3.6
install_requires =
    numpy
    pandas

[options.packages.find]
where=src
